name: Update profile dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '19 5 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public GitHub statistics
        run: python3 scripts/update_dashboard.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile dashboard" && git push)
